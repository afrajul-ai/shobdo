<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a365d">
  <title>SHOBDO (শব্দ) — Test Build</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./src/styles.css">
</head>
<body>
  <div id="test-banner" class="test-banner" role="alert">
    TEST DATA, NOT VERIFIED
  </div>

  <main class="container">
    <header class="app-header">
      <h1>SHOBDO <span lang="bn">(শব্দ)</span></h1>
      <p class="subtitle">English–Bengali Learner's Dictionary</p>

    <section class="status-card" aria-live="polite">

    <section id="debug-panel" class="debug-panel" hidden>
      <h2>Debug Diagnostics (<code>?debug=1</code>)</h2>
      <pre id="debug-output">Loading diagnostics…</pre>
    </section>
  </main>

  <script type="module" src="./src/main.js"></script>
