<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a365d">
  <title>SHOBDO (শব্দ) — Test Build</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./src/styles.css">
</head>
<body>
  <div id="test-banner" class="test-banner" role="alert">
    TEST DATA, NOT VERIFIED
  </div>

  <main class="container">
    <header class="app-header">
      <h1>SHOBDO <span lang="bn">(শব্দ)</span></h1>
      <p class="subtitle">English–Bengali Learner's Dictionary</p>
    </header>

    <section id="search-section" class="search-section" aria-label="Dictionary search">
      <div class="search-box">
        <input
          id="search-input"
          type="search"
          inputmode="search"
          autocomplete="off"
          autocapitalize="none"
          spellcheck="false"
          placeholder="Search English word (e.g. light, water, run)…"
          aria-label="Search English word"
        >
        <button id="clear-btn" type="button" class="clear-btn" aria-label="Clear search" hidden>×</button>
      </div>
      <p id="search-meta" class="search-meta" aria-live="polite">Loading fixtures…</p>
      <ul id="suggestions-list" class="suggestions-list" role="listbox" aria-label="Search suggestions"></ul>
    </section>

    <section id="entry-view" class="entry-view" aria-live="polite" hidden></section>

    <section class="status-card footer-status" aria-live="polite">
      <p id="app-status">Initializing…</p>
      <p id="app-version" class="version-line"></p>
    </section>

    <section id="debug-panel" class="debug-panel" hidden>
      <h2>Debug Diagnostics (<code>?debug=1</code>)</h2>
      <pre id="debug-output">Loading diagnostics…</pre>
    </section>
  </main>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
